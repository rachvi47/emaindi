<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chat - emaindi</title>
  <meta name="theme-color" content="#14213D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body class="chat-page">
  <div id="app">
    <section id="chat">
      <div id="conv">
        <header class="top chat-top">
          <button id="back" class="ic" aria-label="Back">&#8592;</button>
          <div id="peer" class="peer"></div>
          <button id="callBtn" class="ic" aria-label="Voice call">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          </button>
        </header>
        <div id="offline" hidden>No internet · messages will send when you're back online</div>
        <div id="msgs"></div>
        <div id="replybar" hidden><div id="replytxt"></div><button id="replyx" class="ic" aria-label="Cancel reply">&#10005;</button></div>
        <footer class="composer" id="composer">
          <button id="attach" class="ic2" aria-label="Send a photo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
          </button>
          <input type="file" id="file" accept="image/*" hidden>
          <textarea id="txt" rows="1" placeholder="Message" maxlength="5000"></textarea>
          <button id="send" aria-label="Send" hidden>&#10148;</button>
          <button id="mic" aria-label="Record a voice message">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>
        </footer>
        <footer class="composer" id="recbar" hidden>
          <button id="recCancel" class="ic2" aria-label="Cancel recording">&#128465;</button>
          <div class="recinfo"><i class="recdot"></i><span id="recTime">0:00</span><small>Recording…</small></div>
          <button id="recSend" aria-label="Send voice message">&#10148;</button>
        </footer>
      </div>
    </section>
  </div>

  <div id="sheet" hidden></div>
  <div id="info" hidden></div>
  <div id="viewer" hidden><button id="vx" class="ic" aria-label="Close">&#10005;</button><img alt=""></div>
  <div id="dlg" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="chat.js"></script>
</body>
</html>
