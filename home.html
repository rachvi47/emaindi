<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chats - emaindi</title>
  <meta name="theme-color" content="#14213D">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="app">
    <aside id="list">
      <header class="top">
        <button class="dots" id="meBtn" aria-label="My profile"></button>
        <h1 class="logo">emaindi</h1>

        <!-- GROUPS: new group button -->
        <button class="dots" id="grpBtn" aria-label="New group">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </button>

        <!-- NEW: QR scanner button -->
        <button class="dots" id="scanBtn" aria-label="Scan QR code">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm8 0h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm4-4h2v2h-2v-2zm0 4h2v2h-2v-2zm-4-6h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg>
        </button>

        <button class="dots" id="menuBtn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </header>
      <div id="offline" hidden>No internet · showing your saved chats</div>
      <div class="search">
        <input id="q" type="search" placeholder="Search" autocomplete="off">
      </div>
      <div id="rows"></div>
    </aside>

    <section id="chat">
      <div id="empty"><div class="logo">emaindi</div><p>Select a chat or search a phone number to start texting.</p></div>
    </section>
  </div>

  <div id="sheet" hidden></div>
  <div id="info" hidden></div>
  <div id="perm" hidden></div>
  <div id="dlg" hidden></div>
  <div id="toast" hidden></div>

  <!-- NEW: my QR code popup -->
  <div id="qr" hidden></div>
  <!-- NEW: camera scanner + scanned account card -->
  <div id="scan" hidden></div>

  <!-- NEW: QR libraries (generate + scan) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script type="module" src="home.js"></script>
</body>
</html>
