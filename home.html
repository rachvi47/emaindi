<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Chats - emaindi</title>
  <meta name="theme-color" content="#14213D">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
  <link rel="stylesheet" href="home.css">
  <style>
    #calls{flex:1;overflow-y:auto}
    .chip{flex:none;padding:.4rem .95rem;border-radius:2rem;border:1px solid var(--line);background:none;font-weight:600;font-size:.85rem;color:var(--soft);cursor:pointer}
    .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
    :root[data-theme=dark] .chip.on{background:var(--marigold);color:#14213D;border-color:var(--marigold)}
    #dd button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;font-weight:600;border-radius:10px;background:none;border:0;cursor:pointer;color:inherit}
    #dd button:hover{background:rgba(128,128,128,.16)}
    #tabs{display:flex;flex:none;background:inherit;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    #tabs button{flex:1;position:relative;display:grid;place-items:center;padding:.75rem 0;color:var(--soft);background:none;border:0;cursor:pointer}
    #tabs button.on{color:var(--navy)}
    #tabs button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--marigold)}
    #tabs .bdg{position:absolute;top:.4rem;left:calc(50% + .55rem);min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:.6rem;background:#25D366;color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
    :root[data-theme=dark] #tabs button.on{color:#fff}
    #calls .row .cbtn{flex:none;width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:50%;color:var(--navy);background:none;border:0;cursor:pointer}
    :root[data-theme=dark] #calls .row .cbtn{color:var(--marigold)}
  </style>
</head>
<body>
  <div id="app">
    <aside id="list">
      <header class="top">
        <button class="dots" id="meBtn" aria-label="My profile"></button>
        <h1 class="logo">emaindi</h1>

        <!-- NEW: QR scanner button -->
        <button class="dots" id="scanBtn" aria-label="Scan QR code">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm8 0h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm4-4h2v2h-2v-2zm0 4h2v2h-2v-2zm-4-6h2v2h-2v-2zm4 0h2v2h-2v-2z"/></svg>
        </button>

        <button class="dots" id="menuBtn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </header>
      <div id="offline" hidden>No internet · showing your saved chats</div>
      <div class="search">
        <input id="q" type="search" placeholder="Search" autocomplete="off">
      </div>
      <div id="chips" style="display:flex;gap:8px;padding:0 .9rem .6rem;overflow-x:auto;flex:none">
        <button class="chip on" data-f="all">All</button><button class="chip" data-f="unread">Unread</button><button class="chip" data-f="groups">Groups</button>
      </div>
      <div id="rows"></div>
      <div id="calls" hidden></div>

      <!-- bottom bar: Messages and Calls (symbols only) -->
      <nav id="tabs">
        <button class="on" data-tab="chats" aria-label="Messages">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
          <span class="bdg" id="tabChatsBadge" hidden></span>
        </button>
        <button data-tab="calls" aria-label="Calls">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
        </button>
      </nav>
    </aside>

    <section id="chat">
      <div id="empty"><div class="logo">emaindi</div><p>Select a chat or search a phone number to start texting.</p></div>
    </section>
  </div>

  <div id="sheet" hidden></div>
  <div id="info" hidden></div>
  <div id="dlg" hidden></div>
  <div id="toast" hidden></div>

  <!-- NEW: my QR code popup -->
  <div id="qr" hidden></div>
  <!-- NEW: camera scanner + scanned account card -->
  <div id="scan" hidden></div>

  <!-- NEW: QR libraries (generate + scan) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script type="module" src="home.js"></script>
</body>
</html>
